<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<title>Nearest Departures</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#111827;--mut:#6b7280;--acc:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--line:#e5e7eb;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--fg:#e5e7eb;--mut:#94a3b8;--acc:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--line:#223049;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
h1{font-size:1.4rem;margin:0}
.sub{color:var(--mut);font-size:.85rem;margin-top:2px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:flex;gap:6px;margin:14px 0}.seg button{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.t{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.d{font-weight:600}.m{color:var(--mut);font-size:.85rem}
.p{text-align:right;font-size:.85rem}.p b{display:block;font-size:1.2rem}
.ok{color:var(--ok)}.late{color:var(--warn)}.can{color:var(--bad)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--mut)}
.err{color:var(--bad)}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;max-width:92vw;width:440px}
dialog::backdrop{background:#0008}
label{display:block;margin:10px 0 4px;font-size:.85rem;color:var(--mut)}
input{width:100%;font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<main>
<header>
  <div><h1 id="title">Departures</h1><div class="sub" id="sub">Finding your location…</div></div>
  <button id="cfg" aria-label="Settings">⚙︎</button>
</header>
<div class="seg" id="seg">
  <button data-m="auto" class="on">Nearest</button>
  <button data-m="SOE">Southend East</button>
  <button data-m="FST">Fenchurch St</button>
</div>
<div id="out"></div>
<div class="sub" id="foot" style="text-align:center;margin-top:12px"></div>
</main>

<dialog id="dlg">
  <h2 style="margin:0 0 4px;font-size:1.1rem">Settings</h2>
  <div class="sub">Stored only in this browser. Use your own RTT token for personal use; never share the page with it embedded.</div>
  <label for="tok">RTT API token (refresh or access)</label>
  <input id="tok" type="password" autocomplete="off" spellcheck="false">
  <label for="base">API base URL (use your own proxy if the browser is blocked by CORS)</label>
  <input id="base" type="url" value="https://data.rtt.io">
  <div class="row"><button id="cancel">Cancel</button><button id="save" class="on">Save</button></div>
</dialog>

<script>
const STN={
  SOE:{name:'Southend East',lat:51.5373,lon:0.7213},
  FST:{name:'Fenchurch Street',lat:51.5115,lon:-0.0783}
};
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
let mode='auto',pos=null,timer=null,busy=false,backoff=0;
let tok=store.get('rtt_tok',''),base=store.get('rtt_base','https://data.rtt.io').replace(/\/+$/,'');
let acc=null,exp=0;

function km(a,b,c,d){
  const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;
  return 12742*Math.asin(Math.sqrt(h));
}
function pick(){
  if(mode!=='auto')return mode;
  if(!pos)return 'SOE';
  return km(pos.lat,pos.lon,STN.SOE.lat,STN.SOE.lon)<=km(pos.lat,pos.lon,STN.FST.lat,STN.FST.lon)?'SOE':'FST';
}
async function exchange(){
  const r=await fetch(base+'/api/get_access_token',{headers:{Authorization:'Bearer '+tok}});
  if(!r.ok)throw new Error('Token rejected ('+r.status+')');
  const j=await r.json();acc=j.token;exp=Date.parse(j.validUntil)||Date.now()+36e5;
}
async function call(path,retry=true){
  const t=(acc&&exp>Date.now()+6e4)?acc:tok;
  const r=await fetch(base+path,{headers:{Authorization:'Bearer '+t}});
  if(r.status===401&&retry){await exchange();return call(path,false)}
  return r;
}
function hhmm(s){return s?new Date(s).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'--:--'}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function render(code,j){
  const out=$('out');out.replaceChildren();
  const list=(j&&j.services||[]).filter(s=>{
    const d=s.temporalData&&s.temporalData.departure;
    return d&&(!s.scheduleMetadata||s.scheduleMetadata.inPassengerService!==false);
  }).slice(0,12);
  if(!list.length){out.append(el('div','msg','No departures in the next hour.'));return}
  for(const s of list){
    const td=s.temporalData,d=td.departure;
    const cancelled=d.isCancelled||td.displayAs==='CANCELLED';
    const sched=d.scheduleAdvertised||d.scheduleInternal;
    const live=d.realtimeActual||d.realtimeForecast||d.realtimeEstimate;
    const late=d.realtimeAdvertisedLateness;
    const dest=(s.destination&&s.destination[0]&&s.destination[0].location&&s.destination[0].location.description)||'Unknown';
    const op=s.scheduleMetadata&&s.scheduleMetadata.operator&&s.scheduleMetadata.operator.name;
    const pl=s.locationMetadata&&s.locationMetadata.platform;
    const plat=pl&&(pl.actual||pl.planned);
    const c=el('div','card');
    c.append(el('div','t',hhmm(sched)));
    const mid=el('div');mid.append(el('div','d',dest));
    const why=s.reasons&&s.reasons[0]&&s.reasons[0].shortText;
    mid.append(el('div','m',[op,cancelled&&why].filter(Boolean).join(' · ')));
    c.append(mid);
    const p=el('div','p');
    p.append(el('b','',plat?'Plat '+plat:''));
    let st,cls;
    if(cancelled){st='Cancelled';cls='can'}
    else if(live&&late>0){st='Exp '+hhmm(live);cls='late'}
    else if(live){st='On time';cls='ok'}
    else{st='Scheduled';cls=''}
    p.append(el('span',cls,st));
    c.append(p);out.append(c);
  }
}
async function load(){
  if(busy)return;busy=true;
  const code=pick();
  $('title').textContent=STN[code].name;
  $('sub').textContent=(pos?(mode==='auto'?'Nearest station · ':'')+km(pos.lat,pos.lon,STN[code].lat,STN[code].lon).toFixed(1)+' km away':'Location unavailable, showing '+STN[code].name);
  if(!tok){
    $('out').replaceChildren(el('div','msg','Add your RTT token in settings (⚙︎) to see live departures.'));
    busy=false;return;
  }
  try{
    const r=await call('/gb-nr/location?code='+code+'&timeWindow=60');
    if(r.status===204){render(code,{services:[]});}
    else if(r.status===429){
      backoff=(+r.headers.get('Retry-After')||60)*1000;
      throw new Error('Rate limited, retrying in '+Math.round(backoff/1000)+'s');
    }
    else if(!r.ok)throw new Error('API error '+r.status);
    else render(code,await r.json());
    $('foot').textContent='Updated '+new Date().toLocaleTimeString('en-GB');
    $('foot').classList.remove('err');
  }catch(e){
    $('foot').textContent=(e.message==='Failed to fetch'?'Network or CORS error. Try an API proxy in settings.':e.message);
    $('foot').classList.add('err');
  }
  busy=false;
}
function schedule(){
  clearTimeout(timer);
  if(document.hidden)return;
  const w=Math.max(backoff,30000);backoff=0;
  timer=setTimeout(async()=>{await load();schedule()},w);
}
function locate(){
  if(!navigator.geolocation){$('sub').textContent='Geolocation not supported';return}
  navigator.geolocation.watchPosition(p=>{
    const first=!pos;pos={lat:p.coords.latitude,lon:p.coords.longitude};
    if(first||mode==='auto'){const was=$('title').textContent;if(pick()!==Object.keys(STN).find(k=>STN[k].name===was))load()}
  },()=>{load()},{enableHighAccuracy:false,maximumAge:30000,timeout:15000});
}
$('seg').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  mode=b.dataset.m;[...$('seg').children].forEach(x=>x.classList.toggle('on',x===b));
  load();
};
$('cfg').onclick=()=>{$('tok').value=tok;$('base').value=base;$('dlg').showModal()};
$('cancel').onclick=()=>$('dlg').close();
$('save').onclick=()=>{
  tok=$('tok').value.trim();base=($('base').value.trim()||'https://data.rtt.io').replace(/\/+$/,'');
  store.set('rtt_tok',tok);store.set('rtt_base',base);acc=null;exp=0;
  $('dlg').close();load();
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();schedule()}else clearTimeout(timer)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();locate();schedule();
</script>
</body>
</html>
